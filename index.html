<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Journal — NeetCode 150</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Personal LeetCode Journal & Problem Notes following NeetCode 150">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Web App Manifest & Mobile Theme Color -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Fonts: Be Vietnam Pro & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Docsify Theme Base (Dark) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <!-- KaTeX for Math ($O(N)$, etc.) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>

  <style>
    /* ==========================================================================
       DARK ENGINEERING CODEX THEME (Linear / Raycast / Tokyo Night inspired)
       ========================================================================== */
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #151f38;
      --bg-sidebar: #0b0f19;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --accent-cyan: #38bdf8;
      --accent-cyan-glow: rgba(56, 189, 248, 0.15);
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;
      --theme-color: #38bdf8;
    }

    /* Global Reset & Typography */
    html, body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-secondary) !important;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      font-size: 15px;
      line-height: 1.75;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Selection & Scrollbars */
    ::selection {
      background: var(--accent-cyan-glow) !important;
      color: var(--accent-cyan) !important;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* ==========================================================================
       SIDEBAR
       ========================================================================== */
    .sidebar {
      background: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border-subtle) !important;
      color: var(--text-secondary) !important;
      padding: 24px 16px;
      font-size: 14px;
    }
    .sidebar > h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .sidebar > h1 .app-name-link {
      color: var(--text-primary) !important;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-nav strong {
      color: var(--text-muted) !important;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin: 22px 0 8px 8px;
    }
    .sidebar-nav ul {
      padding-left: 0 !important;
      margin: 0 !important;
    }
    .sidebar-nav li {
      margin: 3px 0 !important;
      list-style: none !important;
    }
    .sidebar-nav li a {
      color: var(--text-secondary) !important;
      text-decoration: none !important;
      display: block;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s ease;
      font-size: 13.5px;
      border-left: 2px solid transparent;
    }
    .sidebar-nav li a:hover {
      color: var(--text-primary) !important;
      background: rgba(255, 255, 255, 0.04);
    }
    .sidebar-nav li.active > a {
      color: var(--accent-cyan) !important;
      background: var(--accent-cyan-glow) !important;
      border-left: 2px solid var(--accent-cyan) !important;
      font-weight: 600;
    }

    /* Sidebar Search Box */
    .sidebar .search {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }
    .sidebar .search input {
      background: var(--bg-surface) !important;
      border: 1px solid var(--border-subtle) !important;
      color: var(--text-primary) !important;
      border-radius: 8px !important;
      padding: 9px 14px !important;
      font-size: 13px !important;
      font-family: inherit !important;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
    }
    .sidebar .search input:focus {
      border-color: var(--accent-cyan) !important;
      box-shadow: 0 0 0 3px var(--accent-cyan-glow) !important;
      outline: none;
    }
    .sidebar .search input::placeholder {
      color: var(--text-faint) !important;
    }

    /* ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== */
    .content {
      background: var(--bg-canvas) !important;
      padding-top: 20px;
    }
    .markdown-section {
      max-width: 880px !important;
      padding: 30px 40px 80px 40px !important;
      color: var(--text-secondary) !important;
    }

    /* Headings */
    .markdown-section h1 {
      color: var(--text-primary) !important;
      font-size: 2rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.03em !important;
      margin-top: 0 !important;
      margin-bottom: 1.2rem !important;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .markdown-section h2 {
      color: var(--text-primary) !important;
      font-size: 1.4rem !important;
      font-weight: 600 !important;
      letter-spacing: -0.02em !important;
      margin-top: 2.5rem !important;
      margin-bottom: 1rem !important;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .markdown-section h3 {
      color: var(--text-primary) !important;
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      letter-spacing: -0.015em !important;
      margin-top: 1.8rem !important;
      margin-bottom: 0.75rem !important;
    }
    .markdown-section h4 {
      color: #e2e8f0 !important;
      font-size: 1.02rem !important;
      font-weight: 600 !important;
      margin-top: 1.4rem !important;
      margin-bottom: 0.5rem !important;
    }

    /* Horizontal Rules */
    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 2.2rem 0;
    }

    /* Blockquotes & Alerts */
    .markdown-section blockquote {
      background: var(--bg-surface);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      margin: 1.4rem 0;
      color: var(--text-secondary);
      font-size: 14.5px;
    }
    .markdown-section blockquote p {
      margin: 0 !important;
    }

    /* Inline Links */
    .markdown-section a {
      color: var(--accent-cyan) !important;
      text-decoration: none !important;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .markdown-section a:hover {
      color: #7dd3fc !important;
      border-bottom-color: #7dd3fc;
    }

    /* Inline Code */
    .markdown-section p code,
    .markdown-section li code,
    .markdown-section td code {
      background: #111a2e !important;
      color: #38bdf8 !important;
      border: 1px solid rgba(56, 189, 248, 0.18) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-family: 'JetBrains Mono', 'Consolas', monospace !important;
      font-size: 0.88em !important;
    }

    /* Code Blocks */
    .markdown-section pre {
      background: #0d1527 !important;
      border: 1px solid rgba(56, 189, 248, 0.15) !important;
      border-radius: 10px !important;
      padding: 18px 20px !important;
      margin: 1.4rem 0 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
      position: relative;
    }
    .markdown-section pre > code {
      background: transparent !important;
      color: #e2e8f0 !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace !important;
      font-size: 13.5px !important;
      line-height: 1.65 !important;
      padding: 0 !important;
    }

    /* Prism Syntax Highlighting Custom Palette (Tokyo Night / One Dark) */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #64748b !important; font-style: italic; }
    .token.punctuation { color: #94a3b8 !important; }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #f59e0b !important; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #34d399 !important; }
    .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #38bdf8 !important; }
    .token.atrule, .token.attr-value, .token.keyword { color: #ec4899 !important; font-weight: 500; }
    .token.function, .token.class-name { color: #60a5fa !important; }
    .token.regex, .token.important, .token.variable { color: #a78bfa !important; }

    /* Copy Code Button */
    .docsify-copy-code-button {
      background: var(--bg-surface-elevated) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 6px !important;
      padding: 5px 10px !important;
      font-size: 12px !important;
      font-family: 'Be Vietnam Pro', sans-serif !important;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .docsify-copy-code-button:hover {
      background: var(--bg-surface) !important;
      color: var(--text-primary) !important;
      border-color: var(--accent-cyan) !important;
    }

    /* ==========================================================================
       TABLES (Progress Tracker & Problem Lists)
       ========================================================================== */
    .markdown-section table {
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      margin: 1.6rem 0 !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 8px !important;
      overflow: hidden;
      background: var(--bg-surface) !important;
      background-color: var(--bg-surface) !important;
    }
    .markdown-section table tr,
    .markdown-section table tr:nth-child(2n),
    .markdown-section table tr:nth-child(2n+1),
    .markdown-section table tbody tr,
    .markdown-section table tbody tr:nth-child(2n),
    .markdown-section table tbody tr:nth-child(2n+1) {
      background: var(--bg-surface) !important;
      background-color: var(--bg-surface) !important;
      border: none !important;
    }
    .markdown-section th {
      background: #111a2e !important;
      background-color: #111a2e !important;
      color: var(--text-muted) !important;
      font-weight: 600 !important;
      font-size: 11.5px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      padding: 12px 16px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      text-align: left;
    }
    .markdown-section td {
      background: transparent !important;
      background-color: transparent !important;
      padding: 12px 16px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      color: var(--text-secondary) !important;
      font-size: 13.5px !important;
      font-variant-numeric: tabular-nums;
      vertical-align: middle;
    }
    .markdown-section tr:last-child td {
      border-bottom: none !important;
    }
    .markdown-section tr:hover td {
      background-color: rgba(56, 189, 248, 0.04) !important;
    }

    /* Table Column Typography & Monospace IDs */
    .markdown-section table td:first-child {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12.5px !important;
      color: var(--text-faint) !important;
    }

    /* Badges (Difficulty & Status) */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      line-height: 1.4;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .badge-easy {
      background: rgba(52, 211, 153, 0.1) !important;
      color: #34d399 !important;
      border: 1px solid rgba(52, 211, 153, 0.25) !important;
    }
    .badge-medium {
      background: rgba(251, 191, 36, 0.1) !important;
      color: #fbbf24 !important;
      border: 1px solid rgba(251, 191, 36, 0.25) !important;
    }
    .badge-hard {
      background: rgba(244, 63, 94, 0.1) !important;
      color: #f43f5e !important;
      border: 1px solid rgba(244, 63, 94, 0.25) !important;
    }
    .badge-solved {
      background: rgba(56, 189, 248, 0.1) !important;
      color: #38bdf8 !important;
      border: 1px solid rgba(56, 189, 248, 0.22) !important;
    }
    .badge-solved::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #38bdf8;
      margin-right: 5px;
    }

    /* Note Link Pill in Tables */
    .markdown-section table td a[href*="problems/"] {
      display: inline-flex !important;
      align-items: center !important;
      padding: 3px 9px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      color: #38bdf8 !important;
      background: rgba(56, 189, 248, 0.08) !important;
      border: 1px solid rgba(56, 189, 248, 0.2) !important;
      border-radius: 4px !important;
      text-decoration: none !important;
      transition: all 0.15s ease !important;
    }
    .markdown-section table td a[href*="problems/"]:hover {
      background: rgba(56, 189, 248, 0.18) !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
    }

    /* ==========================================================================
       KATEX FORMULA STYLING
       ========================================================================== */
    .katex {
      font-size: 1.02em !important;
      color: #e0e7ff !important;
    }
    .katex-display {
      margin: 1.2rem 0 !important;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* ==========================================================================
       TASK LISTS & CHECKBOXES
       ========================================================================== */
    .markdown-section ul.task-list,
    .markdown-section .task-list-item {
      list-style-type: none !important;
    }
    .markdown-section input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #475569;
      border-radius: 4px;
      outline: none;
      background: #0f172a;
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      vertical-align: middle !important;
      margin: 0 10px 0 0 !important;
      position: relative;
      top: -1px;
      transition: all 0.15s ease;
    }
    .markdown-section input[type="checkbox"]:checked {
      background-color: var(--accent-cyan) !important;
      border-color: var(--accent-cyan) !important;
    }
    .markdown-section input[type="checkbox"]:checked::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #090d16;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      position: relative;
      top: -1px;
    }
    .markdown-section li > p {
      display: inline !important;
      margin: 0 !important;
    }
    .markdown-section li > ol {
      display: inline-block !important;
      margin: 0 !important;
      padding-left: 0 !important;
      vertical-align: middle !important;
    }
    .markdown-section li {
      margin: 7px 0;
      line-height: 1.7;
    }

    /* Hide GitHub corner ribbon */
    .github-corner {
      display: none !important;
    }

    /* Sidebar Toggle Button (Desktop & Mobile) */
    .sidebar-toggle {
      position: fixed !important;
      top: 14px !important;
      left: 14px !important;
      bottom: auto !important;
      width: 38px !important;
      height: 38px !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background: rgba(15, 23, 42, 0.92) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35) !important;
      cursor: pointer !important;
      z-index: 999 !important;
      transition: all 0.2s ease !important;
    }
    .sidebar-toggle:hover {
      border-color: var(--accent-cyan) !important;
      background: rgba(21, 31, 56, 0.98) !important;
    }
    .sidebar-toggle span {
      display: block !important;
      background-color: var(--text-secondary) !important;
      height: 2px !important;
      width: 17px !important;
      margin: 2px 0 !important;
      border-radius: 4px !important;
      transition: all 0.2s ease !important;
    }
    .sidebar-toggle:hover span {
      background-color: var(--accent-cyan) !important;
    }

    /* ==========================================================================
       MOBILE RESPONSIVE ENGINE (Screen width <= 768px)
       ========================================================================== */
    @media screen and (max-width: 768px) {
      html, body {
        font-size: 14px !important;
      }
      .content {
        padding-top: 0 !important;
      }
      .markdown-section {
        padding: 68px 16px 60px 16px !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
      }
      .markdown-section h1 {
        font-size: 1.6rem !important;
        letter-spacing: -0.025em !important;
        margin-bottom: 1rem !important;
      }
      .markdown-section h2 {
        font-size: 1.25rem !important;
        margin-top: 2rem !important;
        margin-bottom: 0.8rem !important;
      }
      .markdown-section h3 {
        font-size: 1.08rem !important;
        margin-top: 1.5rem !important;
      }

      /* Horizontal Touch Scrolling for Tables */
      .markdown-section table {
        display: block !important;
        width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        white-space: nowrap !important;
        border-radius: 8px !important;
        margin: 1.2rem 0 !important;
      }
      .markdown-section table th,
      .markdown-section table td {
        white-space: nowrap !important;
        padding: 10px 12px !important;
        font-size: 13px !important;
      }
      .markdown-section table td:nth-child(2) {
        white-space: normal !important;
        min-width: 130px !important;
      }

      /* Responsive Code Blocks */
      .markdown-section pre {
        padding: 14px 12px !important;
        margin: 1.1rem 0 !important;
        border-radius: 8px !important;
        font-size: 12.5px !important;
      }
      .markdown-section pre > code {
        font-size: 12.5px !important;
        line-height: 1.6 !important;
      }

      /* Responsive KaTeX Equations */
      .katex-display {
        padding: 8px 6px !important;
        font-size: 0.92em !important;
      }

      /* Dim Backdrop Overlay when Sidebar is open on Mobile */
      body.close::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 90;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading journal...</div>
  <script>
    window.$docsify = {
      name: 'LeetCode Journal',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search problems, patterns, topics...',
        noData: 'No matching notes found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // Auto-close sidebar on mobile after clicking any sidebar navigation link
            var sidebarLinks = document.querySelectorAll('.sidebar-nav a');
            sidebarLinks.forEach(function(link) {
              link.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                  document.body.classList.remove('close');
                }
              });
            });

            // Close sidebar on mobile when clicking content area
            var contentArea = document.querySelector('.content');
            if (contentArea) {
              contentArea.addEventListener('click', function() {
                if (window.innerWidth <= 768 && document.body.classList.contains('close')) {
                  document.body.classList.remove('close');
                }
              });
            }
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Code Highlighting Plugins (Prism) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <!-- Math Formula (KaTeX) Support -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
</body>
</html>
