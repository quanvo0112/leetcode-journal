<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Journal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Personal LeetCode Journal & Problem Notes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme style -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX for Math ($O(N)$, etc.) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  <style>
    :root {
      --theme-color: #0284c7;
    }
    .markdown-section {
      max-width: 900px;
      padding: 30px 20px;
    }
    .markdown-section pre > code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
    }
    .sidebar {
      font-size: 15px;
    }
    .sidebar-nav strong {
      color: #334155;
    }
    /* Fix task list checkboxes alignment */
    .markdown-section ul.task-list,
    .markdown-section .task-list-item {
      list-style-type: none;
    }
    .markdown-section input[type="checkbox"] {
      margin: 0 8px 0 0 !important;
      vertical-align: middle !important;
      display: inline-block !important;
      cursor: pointer;
    }
    .markdown-section li > p {
      display: inline !important;
      margin: 0 !important;
    }
    .markdown-section li > ol {
      display: inline-block !important;
      margin: 0 !important;
      padding-left: 0 !important;
      vertical-align: middle !important;
    }
    .markdown-section li {
      margin: 6px 0;
    }
    /* Hide GitHub corner ribbon */
    .github-corner {
      display: none !important;
    }
    /* Mobile responsive tweaks */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading journal...</div>
  <script>
    window.$docsify = {
      name: '🧠 LeetCode Journal',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search problems or patterns...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Code Highlighting Plugins (Prism) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <!-- Math Formula (KaTeX) Support -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
</body>
</html>
